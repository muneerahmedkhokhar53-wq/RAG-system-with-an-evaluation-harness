[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragkit"
version = "1.0.0"
description = "Production-oriented RAG with hybrid retrieval, hallucination guardrails and a reproducible evaluation harness"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["rag", "retrieval-augmented-generation", "llm", "evaluation", "bm25", "hybrid-search"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.26", "PyYAML>=6.0"]

[project.optional-dependencies]
ui = ["streamlit>=1.40"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
pdf = ["pypdf>=4.0"]
docx = ["python-docx>=1.1"]
neural = ["sentence-transformers>=3.0"]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5"]
all = ["ragkit[ui,api,pdf,docx]"]

[project.scripts]
ragkit = "ragkit.cli:main"

[tool.setuptools.packages.find]
include = ["ragkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E701", "E702", "E731", "E741"]
